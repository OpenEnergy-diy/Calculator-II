<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solar Savings Calculator</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:20px;
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

p{
    color:#666;
}

.slider-value{
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

input[type="range"]{
    width:100%;
}

.result{
    margin-top:30px;
    padding:20px;
    background:#f0f8e8;
    border-radius:12px;
}

.result h2{
    margin-bottom:20px;
}

.result p{
    font-size:22px;
    margin:10px 0;
    color:#111;
}

.green{
    color:#78be20;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <h1>Solar Drive Savings</h1>

    <p>Move the slider to calculate your savings.</p>

    <div class="slider-value">
        <span id="usageValue">25</span> kWh
    </div>

    <input 
        type="range" 
        min="5" 
        max="100" 
        value="25" 
        id="slider">

    <div class="result">

        <h2>Results</h2>

        <p>
            Conventional MPPT:
            <span id="mppt">₹ 3,200</span>
        </p>

        <p>
            Solar Drive:
            <span id="solar" class="green">₹ 5,600</span>
        </p>

        <p>
            Additional Savings:
            <span id="difference" class="green">₹ 2,400</span>
        </p>

        <p>
            Annual Savings:
            <span id="annual" class="green">₹ 28,800</span>
        </p>

    </div>

</div>

<script>

const slider = document.getElementById("slider");

const usageValue = document.getElementById("usageValue");

const mppt = document.getElementById("mppt");

const solar = document.getElementById("solar");

const difference = document.getElementById("difference");

const annual = document.getElementById("annual");

function updateCalculator() {

    const value = parseInt(slider.value);

    usageValue.innerText = value;

    const mpptValue = value * 128;

    const solarValue = value * 224;

    const diffValue = solarValue - mpptValue;

    const annualValue = diffValue * 12;

    mppt.innerText = `₹ ${mpptValue.toLocaleString()}`;

    solar.innerText = `₹ ${solarValue.toLocaleString()}`;

    difference.innerText = `₹ ${diffValue.toLocaleString()}`;

    annual.innerText = `₹ ${annualValue.toLocaleString()}`;
}

slider.addEventListener("input", updateCalculator);

updateCalculator();

</script>

</body>
</html>
