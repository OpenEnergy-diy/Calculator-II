```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Calculator</title>

<style>

body{
    font-family:Arial;
    padding:40px;
    background:#f5f5f5;
}

.container{
    background:white;
    padding:40px;
    border-radius:20px;
    max-width:700px;
    margin:auto;
}

h1{
    font-size:42px;
}

input{
    width:100%;
    margin-top:20px;
}

.result{
    margin-top:30px;
    font-size:24px;
}

.green{
    color:green;
}

</style>
</head>

<body>

<div class="container">

<h1>Solar Savings Calculator</h1>

<p>
Daily Usage:
<span id="usage">25</span> kWh
</p>

<input
type="range"
min="5"
max="100"
value="25"
id="slider">

<div class="result">
<p>MPPT: <span id="mppt">₹ 3,200</span></p>

<p>Solar Drive:
<span id="solar" class="green">₹ 5,600</span>
</p>

<p>Extra Savings:
<span id="difference" class="green">₹ 2,400</span>
</p>

<p>Annual Savings:
<span id="annual" class="green">₹ 28,800</span>
</p>
</div>

</div>

<script>

const slider = document.getElementById("slider");

const usage = document.getElementById("usage");

const mppt = document.getElementById("mppt");

const solar = document.getElementById("solar");

const difference = document.getElementById("difference");

const annual = document.getElementById("annual");

function updateCalculator(){

    const value = parseInt(slider.value);

    usage.innerText = value;

    const mpptValue = value * 128;

    const solarValue = value * 224;

    const diffValue = solarValue - mpptValue;

    const annualValue = diffValue * 12;

    mppt.innerText = `₹ ${mpptValue.toLocaleString()}`;

    solar.innerText = `₹ ${solarValue.toLocaleString()}`;

    difference.innerText = `₹ ${diffValue.toLocaleString()}`;

    annual.innerText = `₹ ${annualValue.toLocaleString()}`;
}

slider.addEventListener("input", updateCalculator);

updateCalculator();

</script>

</body>
</html>
```
